name: RetinaSense CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:

  # ============================================================
  # BACKEND CI
  # ============================================================

  backend:
    name: Backend - Test & Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dr-backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: dr-backend/requirements.txt

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m compileall .

      - name: Check backend imports
        run: |
          python -c "import main; print('Backend import successful')"

      - name: Run backend tests
        run: |
          if [ -d "tests" ]; then
            pytest -v
          else
            echo "No tests directory found - skipping pytest"
          fi


  # ============================================================
  # FRONTEND CI
  # ============================================================

  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dr-frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dr-frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint --if-present

      - name: Build frontend
        run: |
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: retina-sense-frontend
          path: dr-frontend/dist


  # ============================================================
  # SECURITY CHECK
  # ============================================================

  security:
    name: Security - Dependency Audit
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # Frontend dependency audit
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dr-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: dr-frontend
        run: |
          npm ci

      - name: Frontend security audit
        working-directory: dr-frontend
        run: |
          npm audit --audit-level=high || true

      # Backend dependency audit
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Backend security audit
        working-directory: dr-backend
        run: |
          pip-audit -r requirements.txt || true


  # ============================================================
  # BUILD
  # ============================================================

  build:
    name: Build Application
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend
      - security

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: dr-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate backend
        working-directory: dr-backend
        run: |
          python -m compileall .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dr-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: dr-frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: dr-frontend
        run: |
          npm run build

      - name: Create release package
        run: |
          mkdir -p release

          cp -r dr-backend release/backend
          cp -r dr-frontend/dist release/frontend

          rm -rf release/backend/__pycache__
          rm -rf release/backend/.pytest_cache

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: retinasense-release
          path: release


  # ============================================================
  # CD - PRODUCTION DEPLOYMENT PLACEHOLDER
  # ============================================================

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    needs:
      - build

    # Only deploy pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: retinasense-release
          path: release

      - name: Production deployment
        run: |
          echo "=========================================="
          echo "RetinaSense production deployment"
          echo "=========================================="
          echo ""
          echo "CI completed successfully."
          echo "Production deployment target is not configured yet."
          echo ""
          echo "Configure this job for:"
          echo "Render / Railway / AWS / Azure / VPS / Docker"
          echo ""
          echo "Deployment artifact is available in:"
          echo "release/"
